services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: eo_sales
      POSTGRES_USER: eo_sales
      POSTGRES_PASSWORD: local_dev_only_change_me
    ports:
      - "5432:5432"
    volumes:
      - eo_sales_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eo_sales -d eo_sales"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://eo_sales:local_dev_only_change_me@db:5432/eo_sales
      JWT_SECRET: local-development-secret-change-before-deployment
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  eo_sales_pgdata:
